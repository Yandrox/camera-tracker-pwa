<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Camera Tracker IMU</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <video id="video" autoplay playsinline muted></video>

  <div class="top">
    <p id="status">Iniciando camara...</p>
    <button id="btn-info" class="chip" type="button">Info</button>
  </div>
  <pre id="diag" class="hidden"></pre>

  <div class="bottom">
    <button id="btn-export" class="side" type="button">Exportar</button>
    <button id="btn-record" type="button">Grabar</button>
    <button id="btn-export-bone" class="side" type="button">Exportar hueso</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
